# Test workflow for the private JFrog Traceability action.
# Requires: the action repo (SaharBracha/github-evidence) has
# Settings → Actions → General → Access set to
# "Accessible from repositories owned by SaharBracha".
name: JFrog Traceability (test)
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  id-token: write       # required for JFrog OIDC + signing
  contents: write
  attestations: write   # required by actions/attest-build-provenance
  actions: write        # detected by attest action for the GHA env
  packages: write       # for uploading attestations.

jobs:
  evidence-and-publish:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JFrog CLI
        id: setup-jfrog-cli
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: https://${{ vars.JF_URL }}
        with:
          oidc-provider-name: yuriorgorg/evidence-upload@github

      - name: Bump semver on push to main
        if: github.event_name == 'push'
        id: bump
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Resolve image tag
        id: tag
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          if [ -n "${NEW_VERSION}" ]; then
            echo "tag=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push slim image
        env:
          REGISTRY: ${{ vars.JF_URL }}
          OIDC_USER: ${{ steps.setup-jfrog-cli.outputs.oidc-user }}
          OIDC_TOKEN: ${{ steps.setup-jfrog-cli.outputs.oidc-token }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "${OIDC_TOKEN}" | docker login "${REGISTRY}" -u "${OIDC_USER}" --password-stdin

          echo "----- docker config email(s) -----"
          jq -r '.auths | to_entries[] | "\(.key): \(.value.email // "no email")"' ~/.docker/config.json || true
          echo "----- end -----"

          IMAGE="${REGISTRY}/docker-local/evidence-upload:${IMAGE_TAG}"
          docker build -t "${IMAGE}" .
          jf docker push "${IMAGE}"

      - name: Attach git evidence
        if: github.event_name == 'push'
        uses: SaharBracha/github-evidence@main
        with:
          jf_url: ${{ vars.JF_URL }}
          oidc_provider_name: yuriorgorg/evidence-upload@github
          evidence_signing_key: ${{ secrets.EVIDENCE_KEY }}
          evidence_key_alias:  ${{ vars.EVIDENCE_KEY_ALIAS }}
